<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12452c" />
    <meta name="description" content="Life Science Pharmaceutical — Better Animal Health. Stronger Farms." />
    <meta name="google-site-verification" content="2kXppoPVEDqMnZo1PFzdFT5Dej8vrRdHwGs8nbmoSns" />
    <title>Life Science Pharmaceutical | Better Animal Health. Stronger Farms.</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Suppress Google Translate Top Banner and Tooltips off-screen so worker keeps running */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe[class*="goog-te-banner-frame"],
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        z-index: -9999 !important;
      }

      html, body {
        top: 0px !important;
        margin-top: 0px !important;
        position: static !important;
      }

      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }

      font {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
    <script type="text/javascript">
      // Sync stored language preference into googtrans cookie and load Google Translate ONLY when needed
      (function() {
        var needsTranslate = false;
        try {
          var lang = localStorage.getItem('life_science_lang');
          if (lang === 'hi') {
            document.cookie = 'googtrans=/en/hi; path=/;';
            needsTranslate = true;
          } else if (lang === 'en') {
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'googtrans=/en/en; path=/;';
          } else if (document.cookie.indexOf('googtrans=/en/hi') !== -1) {
            needsTranslate = true;
          }
        } catch(e) {}

        function resetTopOffset() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          if (document.documentElement && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
            document.documentElement.style.top = '0px';
          }
        }

        var gtLoaded = false;
        window.googleTranslateElementInit = function() {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi',
              autoDisplay: false
            }, 'google_translate_element');
            resetTopOffset();
          }
        };

        // Load Google Translate strictly on-demand (after window.onload) so browser tab spinner stops immediately
        window.loadGoogleTranslate = function() {
          if (gtLoaded) return;
          gtLoaded = true;
          if (typeof MutationObserver !== 'undefined') {
            var obs = new MutationObserver(resetTopOffset);
            if (document.documentElement) {
              obs.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
            }
            if (document.body) {
              obs.observe(document.body, { attributes: true, attributeFilter: ['style'] });
            }
          }
          var s = document.createElement('script');
          s.type = 'text/javascript';
          s.async = true;
          s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          document.body.appendChild(s);
        };

        if (needsTranslate) {
          window.addEventListener('load', function() {
            setTimeout(window.loadGoogleTranslate, 60);
          }, { once: true });
        }
      })();
    </script>
  </head>
  <body>
    <!-- Hidden container for Google Translate (must be off-screen, NOT display:none) -->
    <div id="google_translate_element" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

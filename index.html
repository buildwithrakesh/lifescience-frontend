    <script>
      // Speed: on the home page, start downloading the first hero banner image while the JavaScript is
      // still loading (otherwise the browser only discovers it after React renders). This mirrors exactly
      // how HeroSlider.jsx picks its first image (cached sliders -> default slides, saved slide index,
      // Cloudinary f_auto,q_auto,w_1400), so the <img> reuses this download instead of fetching twice.
      (function () {
        try {
          var path = window.location.pathname;
          if (path !== "/" && path !== "/index.html") return;
          var urls = [
            "https://res.cloudinary.com/duqwahasz/image/upload/v1795069481/lifescience/sliders/iyeldcpl7lcwpwfhuhf7.jpg",
            "https://res.cloudinary.com/duqwahasz/image/upload/v1795069418/lifescience/sliders/abvz8nmedyrri0gksr8c.jpg",
            "https://res.cloudinary.com/duqwahasz/image/upload/v1795069538/lifescience/sliders/o2a8goctmeqm4louf4yt.jpg"
          ];
          // main.jsx clears the cached sliders when the app cache version changes, so only trust the
          // cache when the stored version matches (value injected at build time from main.jsx).
          var version = "__APP_CACHE_VERSION__";
          if (version && localStorage.getItem("lifescience_app_version") === version) {
            var cached = JSON.parse(localStorage.getItem("vetora_cached_sliders") || "null");
            if (Array.isArray(cached) && cached.length > 0) {
              urls = [];
              for (var i = 0; i < cached.length; i++) urls.push(cached[i] ? cached[i].imageUrl : "");
            }
          }
          var index = 0;
          var saved = parseInt(sessionStorage.getItem("life_science_hero_slide"), 10);
          if (!isNaN(saved) && saved >= 0) index = Math.min(saved, urls.length - 1);
          var url = urls[index];
          if (typeof url !== "string" || !/^https?:\/\//.test(url)) return;
          if (url.indexOf("cloudinary.com") !== -1 && url.indexOf("/upload/") !== -1) {
            if (url.indexOf("/upload/f_auto") !== -1 || url.indexOf("/upload/q_auto") !== -1) {
              url = url.replace(/(\/upload\/[^/]*?)w_\d+/, "$1w_1400");
            } else {
              url = url.replace("/upload/", "/upload/f_auto,q_auto,w_1400/");
            }
          }
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = url;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>

    <script type="text/javascript">
      // Sync stored language preference into googtrans cookie and load Google Translate ONLY when needed
      (function() {
        var needsTranslate = false;
        try {
          var lang = localStorage.getItem('life_science_lang');
          if (lang === 'hi') {
            document.cookie = 'googtrans=/en/hi; path=/;';
            needsTranslate = true;
          } else if (lang === 'en') {
            document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'googtrans=/en/en; path=/;';
          } else if (document.cookie.indexOf('googtrans=/en/hi') !== -1) {
            needsTranslate = true;
          }
        } catch(e) {}

        function resetTopOffset() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          if (document.documentElement && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
            document.documentElement.style.top = '0px';
          }
        }

        var gtLoaded = false;
        window.googleTranslateElementInit = function() {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi',
              autoDisplay: false
            }, 'google_translate_element');
            resetTopOffset();
          }
        };

        // Load Google Translate strictly on-demand (after window.onload) so browser tab spinner stops immediately
        window.loadGoogleTranslate = function() {
          if (gtLoaded) return;
          gtLoaded = true;
          if (typeof MutationObserver !== 'undefined') {
            var obs = new MutationObserver(resetTopOffset);
            if (document.documentElement) {
              obs.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
            }
            if (document.body) {
              obs.observe(document.body, { attributes: true, attributeFilter: ['style'] });
            }
          }
          var s = document.createElement('script');
          s.type = 'text/javascript';
          s.async = true;
          s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          document.body.appendChild(s);
        };

        if (needsTranslate) {
          window.addEventListener('load', function() {
            setTimeout(window.loadGoogleTranslate, 60);
          }, { once: true });
        }
      })();
    </script>
